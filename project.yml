name: SimonTheDragonSlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GameCore:
    path: Packages/GameCore
targets:
  SimonTheDragonSlayer:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GameCore
    settings:
      base:
        # Change before shipping: must match the App ID in your Apple Developer account.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.simonthedragonslayer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        # Label under the home-screen icon. iOS cuts it off after about 12 characters, so this is a
        # short form of "game.title" in App/Resources/Lore.json.
        INFOPLIST_KEY_CFBundleDisplayName: Dragon Slayer
